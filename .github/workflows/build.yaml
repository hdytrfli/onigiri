name: Build

on:
  push:
  pull_request:

jobs:
  assemble:
    name: Assemble
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew :app:assembleLibreDebug -PtargetAbi=arm64-v8a
      - name: Upload artifact onigiri-libre-arm64-v8a-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: onigiri-libre-arm64-v8a-debug.apk
          path: ./app/build/outputs/apk/libre/debug/app-libre-arm64-v8a-debug.apk
