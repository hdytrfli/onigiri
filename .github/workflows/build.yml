name: Build APK

on:
  workflow_call:
    inputs:
      gradle_task:
        required: true
        type: string
      apk_directory:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      make_latest:
        required: true
        type: boolean
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_KEYSTORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Kotlin formatting
        run: ./gradlew ktfmtCheck ktfmtCheckScripts

      - name: Decode signing key
        id: signing_key
        uses: timheuer/base64-to-file@v2
        with:
          fileName: release.keystore
          encodedString: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing_key.outputs.filePath }}
        run: ./gradlew :app:${{ inputs.gradle_task }} -PtargetAbi=arm64-v8a

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: ${{ inputs.apk_directory }}/*.apk
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
